    <meta name="robots" content="index,follow" />
    <meta property="og:type" content="website" />

    <meta property="og:site_name" content="Sushi Lab" />

    <meta name="twitter:card" content="summary_large_image" />
    <link rel="canonical" href="https://sushi-five-ecru.vercel.app/" />
    <script>
      const manifestLink = document.createElement("link");
      manifestLink.rel = "manifest";
      manifestLink.href = window.location.pathname.replace(/\/+$/, "") === "/admin"
        ? "/admin.webmanifest"
        : "/manifest.webmanifest";
      document.head.appendChild(manifestLink);
      if (window.location.pathname === "/") {
        const heroImage = document.createElement("link");
        heroImage.rel = "preload";
        heroImage.as = "image";
        heroImage.href = "/menu/menu-01.webp";
        heroImage.fetchPriority = "high";
        document.head.appendChild(heroImage);
      }
    </script>
    <link rel="icon" type="image/svg+xml" href="/sushi-icon.svg" />
    <title>Sushi Lab — роллы, суши и доставка в Бишкеке</title>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Restaurant",
        "name": "Sushi Lab",
        "url": "https://sushi-five-ecru.vercel.app/",
        "image": "https://sushi-five-ecru.vercel.app/menu/menu-01.jpeg",
        "description": "Свежие роллы, суши и пицца с доставкой по Бишкеку.",
        "servesCuisine": ["Japanese", "Sushi"],
        "areaServed": {
          "@type": "City",
          "name": "Bishkek"
        },
        "openingHours": "Mo-Su 10:00-23:00",
        "menu": "https://sushi-five-ecru.vercel.app/menu"
      }
    </script>
  </head>
